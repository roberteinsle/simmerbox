services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${APP_PORT:-8000}:80"
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - db-data:/var/www/html/database
      - storage-data:/var/www/html/storage/app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - REVERB_APP_ID=${REVERB_APP_ID:-simmerbox}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-simmerbox-key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-simmerbox-secret}
      - REVERB_HOST=${REVERB_HOST:-localhost}
      - REVERB_PORT=${REVERB_PORT:-8080}
      - REVERB_SCHEME=${REVERB_SCHEME:-http}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
    driver: local
  storage-data:
    driver: local
